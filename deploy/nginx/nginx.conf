# API gateway: one origin for the mobile app and web clients.
# Routes /api/<Service>/... to the matching container. Terminate TLS in front of
# this (or extend this config) for anything beyond local development.

worker_processes auto;
events { worker_connections 1024; }

http {
    client_max_body_size 25m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: survive container restarts

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    # $http_host keeps the port, so same-origin checks (Socket.IO) see what the client used.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;   # assistant turns can take a while

    server {
        listen 80;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/MedicusUser/ {
            set $upstream http://user:8002;
            proxy_pass $upstream;
        }

        location /api/MedicusConvo/socketio {
            set $upstream http://convo:8003;
            proxy_pass $upstream;
            # A location with its own proxy_set_header inherits none from the server
            # block, so the forwarding headers are repeated here.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_buffering off;
        }

        location /api/MedicusConvo/ {
            set $upstream http://convo:8003;
            proxy_pass $upstream;
        }

        location /api/MedicusAI/ {
            set $upstream http://ai:8000;
            proxy_pass $upstream;
        }

        location /api/MedicusNotification/ {
            set $upstream http://notification:8004;
            proxy_pass $upstream;
        }

        # Internal service-to-service APIs are never exposed through the gateway.
        location ~ ^/api/(MedicusConvo/internal|MedicusNotification/(notifications|events)|v1/|internal/) {
            return 404;
        }

        location = /healthz {
            return 200 "ok\n";
        }
    }
}
