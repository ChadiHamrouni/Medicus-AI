appId: org.medicus.app
---
# Test: Create Patient Account with Phone Number

- tapOn: Expo Go

- tapOn:
    text: Medicus
    index: -1

# Wait for Role Selection Screen
- extendedWaitUntil:
    visible: "Welcome to Medicus!"
    timeout: 90000

# Select Patient role
- tapOn: "Patient"

# Tap Continue as Patient
- tapOn: "Continue as Patient"

# Wait for Sign Up Method Selection
- extendedWaitUntil:
    visible: "Choose how to sign up"
    timeout: 10000

# Select Phone signup method
- tapOn: "Continue with phone number"

# Wait for Phone Sign Up Form
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 10000

# Enter Phone Number
- tapOn: "Phone Number"
- inputText: "5559876543"

# Enter Password
- tapOn: "Password"
- inputText: "TestPatient123!"

# Enter Confirm Password
- tapOn: "Confirm Password"
- inputText: "TestPatient123!"

# Hide keyboard
- hideKeyboard

# Tap Continue
- tapOn: "Continue"

# Wait for Personal Details Form
- extendedWaitUntil:
    visible: "Personal details"
    timeout: 10000

# Enter First Name
- tapOn: "First Name"
- inputText: "Jane"

# Enter Last Name
- tapOn: "Last Name"
- inputText: "Doe"

# Enter Date of Birth
- tapOn: "Date of Birth"
- inputText: "03/22/1995"

# Select Gender
- tapOn: "Gender"
- tapOn: "Female"

# Hide keyboard
- hideKeyboard

# Take screenshot before creating account
- takeScreenshot: patient_account_form_filled

# Tap Create Account
- tapOn: "Create Account"

# Wait for success or next screen
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000

# Take screenshot of success
- takeScreenshot: patient_account_created
