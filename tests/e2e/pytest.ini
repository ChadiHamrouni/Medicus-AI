[pytest]
# Run from the repository root:  pytest tests/e2e          (no LLM needed)
#                                 pytest tests/e2e -m llm   (real model, slow)
testpaths = .
addopts = -ra -m "not llm"
markers =
    llm: needs the LLM configured in .env; opt in with -m llm
    container: runs code inside the ai container through docker compose exec
filterwarnings =
    ignore::DeprecationWarning
