[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medicus-notification"
version = "1.0.0"
description = "Contract (enums, models, event registry) and client for the Medicus notification service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "httpx>=0.25"]

[tool.setuptools.packages.find]
include = ["medicus_notification*"]
