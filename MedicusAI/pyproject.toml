[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medicus-ai"
version = "1.0.0"
description = "AI-powered medical assistant platform with voice, text, and image processing capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "MedicusAI Team", email = "team@medicusai.com"},
]
keywords = ["medical", "ai", "healthcare", "assistant", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.12,<0.116",
    "uvicorn[standard]>=0.34.2,<0.35",
    "python-multipart>=0.0.9,<0.1",
    
    # Database
    "asyncpg>=0.30.0,<0.31",
    "redis>=6.2.0,<7.0",
    "elasticsearch>=9.0.0,<10.0",
    
    # AI/ML
    "openai>=1.82.0,<2.0",
    "openai-agents>=0.0.6,<1.0",
    "numpy>=2.2.6,<3.0",
    "tiktoken>=0.9.0,<1.0",
    
    # Data Processing
    "pydantic>=2.11.5,<3.0",
    "email-validator>=2.2.0,<3.0",
    "pandas>=2.2.3,<3.0",
    "pillow>=11.2.1,<12.0",
    "PyMuPDF>=1.25.4,<2.0",
    "opencv-python>=4.11.0.86,<5.0",
    "sounddevice>=0.5.2,<1.0",
    "soundfile>=0.12.1,<1.0",
    "mutagen>=1.47.0,<2.0",
    
    # Cloud Services
    "azure-core>=1.34.0,<2.0",
    "azure-servicebus>=7.12.0,<8.0",
    "azure-identity>=1.21.0,<2.0",
    "azure-storage-blob>=12.25.0,<13.0",
    "boto3>=1.38.20,<2.0",

    # Utilities
    "python-dotenv>=1.1.0,<2.0",
    "rich>=14.0.0,<15.0",
    "aiofiles>=24.1.0,<25.0",
    "httpx>=0.28.1,<1.0",
    "websockets>=15.0.1,<16.0",
    "aiosmtplib>=4.0.1,<5.0",
    "GitPython>=3.1.44,<4.0",
    
    # Specialized
    "pybloom-live>=4.0.0,<5.0",
    "fpdf>=1.7.2,<2.0",
    "piexif>=1.1.3,<2.0",
    "route>=2025.2.23.1,<2026.0",
    "fsspec>=2025.5.0,<2026.0",
    "urllib3>=2.0.3,<3.0",
    "pathlib>=1.0.1,<2.0",
    "matplotlib>=3.8.4,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "flake8>=7.0.0",
    "bandit>=1.7.5",
    "safety>=3.0.0",
    "pre-commit>=3.6.0",
]

internal = [
    "streamlit>=1.44.1,<2.0",
    "streamlit-ace>=0.1.1,<1.0",
    "streamlit-msal>=0.2.0,<1.0",
    "streamlit-extras>=0.7.1,<1.0",
]

monitoring = [
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-asyncpg>=0.43b0",
    "opentelemetry-instrumentation-redis>=0.43b0",
    "sentry-sdk[fastapi]>=1.40.0",
]

all = ["medicus-ai[dev,internal,monitoring]"]

[project.urls]
Homepage = "https://github.com/medicusai/medicus-ai"
Documentation = "https://docs.medicusai.com"
Repository = "https://github.com/medicusai/medicus-ai.git"
"Bug Tracker" = "https://github.com/medicusai/medicus-ai/issues"

[project.scripts]
medicus-ai = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "internal*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"src.agents.*.artifacts" = ["*.md", "*.json", "*.txt"]
"src.assistants.*.artifacts" = ["*.md", "*.json", "*.txt"]

# Development Tools Configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src", "internal"]
known_third_party = [
    "fastapi", "uvicorn", "pydantic", "asyncpg", "redis", "elasticsearch",
    "openai", "numpy", "pandas", "pillow", "azure", "boto3"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_context = true
show_column_numbers = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "agents.*",
    "streamlit.*",
    "sounddevice.*",
    "soundfile.*",
    "mutagen.*",
    "cv2.*",
    "PIL.*",
    "fitz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--maxfail=1",
    "--tb=short",
    "-v",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
    "*/artifacts/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    ".venv",
    "venv",
]
per-file-ignores = [
    "__init__.py:F401",
]